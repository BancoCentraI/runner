name: akillisletme
description: "A new Flutter project."
publish_to: 'none' 
version: 2.0.0+5

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # Core / Architecture
  equatable: ^2.0.5
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.0.0
  get_it: ^9.2.1
  go_router: ^17.1.0
  json_annotation: ^4.10.0

  # Cache / Storage
  hive_ce: ^2.11.3
  path_provider: ^2.1.6
  shared_preferences: ^2.5.4

  # Localization
  easy_localization: ^3.0.1

  # ── Firebase ────────────────────────────────────────────────
  # Paketler her zaman kurulu gelir; Firebase'in AKTIF olup olmadigini
  # `AppConfig.firebaseEnabled` belirler. Boylece template klonlandigi anda
  # derlenir ve `flutterfire configure` yapilmadan da calisir.
  #
  # SURUM PINLERI BILEREK DAR: FlutterFire paketleri toplu (batch) yayinlanir
  # ve tek bir paketin eksik/bozuk yayini tum zinciri kirar. Cozumleme hatasi
  # alirsan korlemesine `pub upgrade` yapma; calisan araligi koru.
  firebase_core: ">=4.11.0 <4.12.0"
  firebase_auth: ^6.5.4
  firebase_analytics: ^12.4.3
  firebase_crashlytics: ^5.2.4
  firebase_remote_config: ^6.1.4
  firebase_messaging: ^16.4.1
  firebase_storage: ">=13.0.0 <14.0.0"
  cloud_firestore: ">=6.6.0 <6.7.0"

  # FCM foreground'da bildirimi GOSTERMEZ — uygulama acikken bildirimi
  # gostermek bize kalir.
  flutter_local_notifications: ^22.0.1

  # ── Sosyal giris ────────────────────────────────────────────
  # v7 KIRICI surumdur: `signIn()` kaldirildi, once `initialize()` sonra
  # `authenticate()` cagrilir. Internetteki v6 ornekleri calismaz.
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  crypto: ^3.0.7

  # UI / Widget
  cupertino_icons: ^1.0.8
  dynamic_color: ^1.7.0
  flutter_svg: ^2.0.17
  font_awesome_flutter: ^10.12.0
  lottie: ^3.3.2
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.2.1
  vector_graphics: ^1.1.15

  # Odeme / abonelik (RevenueCat) — Firebase'den bagimsiz calisir.
  purchases_flutter: ^10.8.0

  # Permission
  permission_handler: ^11.3.1

  # Utility
  audioplayers: ^6.5.1
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.1
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.15
  flutter_gen_runner: ^5.10.0
  freezed: ^3.0.0
  go_router_builder: ^4.2.0
  hive_ce_generator: ^1.10.0
  json_serializable: ^6.6.1

  # Lint
  very_good_analysis: ^7.0.0

# `rps <ad>` ile calisir (dart pub global activate rps).
# rps kurulu degilse ayni islerin karsiligi ./script/<ad>.sh dosyalaridir.
scripts:
  # Bagimlilik + codegen + ceviri anahtarlari — klon sonrasi tek komut.
  general: sh ./script/general.sh
  codegen: sh ./script/codegen.sh
  lang: sh ./script/lang.sh
  # Bitirme kontrolu: format -> analyze -> test.
  verify: sh ./script/verify.sh
  deepClean: sh ./script/deep_clean.sh
  watch: dart run build_runner watch --delete-conflicting-outputs

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/translations/
    - assets/image/
    - assets/svg/
    - assets/lottie/
    - assets/songs/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/font/poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/font/poppins/Poppins-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/font/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/font/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/font/poppins/Poppins-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/font/inter/Inter-VariableFont_opsz,wght.ttf
        - asset: assets/font/inter/Inter-Italic-VariableFont_opsz,wght.ttf
          style: italic

flutter_gen:
  output: lib/product/generated/
  assets:
    exclude:
      # Klasoru git'te tutan yer tutucular; asset accessor'i uretilmesin.
      - assets/**/.gitkeep
  integrations:
    lottie: true
    flutter_svg: true
